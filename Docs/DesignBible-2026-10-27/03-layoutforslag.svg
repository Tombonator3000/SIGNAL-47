<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800"><rect width="1600" height="800" fill="#ede8dc"/><text x="64" y="70" font-family="sans-serif" font-size="37" font-weight="700" fill="#193d3d">CALICHE OG SARO / MULIG MER NATURLIG STRUKTUR</text><text x="64" y="105" font-family="sans-serif" font-size="17" fill="#555d54">Forslag til senere Unreal-arbeid · skjematisk · ikke målestokk og ingen bygninger er flyttet</text><path d="M85 462 C340 458 375 400 600 410 S1000 450 1510 417" fill="none" stroke="#676e69" stroke-width="58"/><path d="M85 462 C340 458 375 400 600 410 S1000 450 1510 417" fill="none" stroke="#eadcb2" stroke-width="3" stroke-dasharray="18 17"/><path d="M320 440 C300 350 265 300 230 250 M1130 430 C1140 510 1200 570 1290 605" fill="none" stroke="#aca797" stroke-width="23"/><rect x="120" y="165" width="235" height="80" rx="10" fill="#f7f3e9" stroke="#617d75" stroke-width="2"/><text x="237.5" y="196.0" font-family="sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#263e3d">SARO</text><text x="237.5" y="219.0" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#263e3d">Avkjørsel, parkering, service</text><rect x="405" y="270" width="200" height="70" rx="10" fill="#f7f3e9" stroke="#617d75" stroke-width="2"/><text x="505.0" y="301.0" font-family="sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#263e3d">MOTELL</text><text x="505.0" y="324.0" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#263e3d">Lav bebyggelse, rolig tun</text><rect x="765" y="255" width="210" height="70" rx="10" fill="#f7f3e9" stroke="#617d75" stroke-width="2"/><text x="870.0" y="286.0" font-family="sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#263e3d">DINER + STASJON</text><text x="870.0" y="309.0" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#263e3d">Kryss, parkering og liv</text><rect x="1000" y="255" width="210" height="70" rx="10" fill="#f7f3e9" stroke="#617d75" stroke-width="2"/><text x="1105.0" y="286.0" font-family="sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#263e3d">BYKJERNE</text><text x="1105.0" y="309.0" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#263e3d">Sheriff, butikk, kino</text><rect x="1190" y="595" width="265" height="70" rx="10" fill="#f7f3e9" stroke="#617d75" stroke-width="2"/><text x="1322.5" y="626.0" font-family="sans-serif" font-size="18" text-anchor="middle" font-weight="bold" fill="#263e3d">BAKRE SERVICE</text><text x="1322.5" y="649.0" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#263e3d">Levering, gårdsrom, jordveier</text><text x="610.0" y="590.0" font-family="sans-serif" font-size="20" text-anchor="start" font-weight="normal" fill="#263e3d">Konsentrer handel ved knutepunktet; la mellomrom, terreng og gårdsveier</text><text x="610.0" y="620.0" font-family="sans-serif" font-size="20" text-anchor="start" font-weight="normal" fill="#263e3d">forklare avstanden til observatoriet. Bevar eksisterende oppdragsruter.</text><text x="90.0" y="740.0" font-family="sans-serif" font-size="16" text-anchor="start" font-weight="normal" fill="#263e3d">Dette er et arbeidsforslag som må testes mot faktisk kjøring, kollisjon, dialoger og siktlinjer.</text></svg>