<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.obj{position:absolute;left:40px;top:34px;max-width:520px}
.obj .tag{font-family:VT;font-size:22px;letter-spacing:3px;color:var(--amber)}
.obj .tag span{color:#7d786d}
.obj .t{font-size:20px;line-height:1.4;color:#efe7d3;margin-top:4px;text-shadow:0 2px 6px rgba(0,0,0,.9)}
.watch{position:absolute;right:40px;top:30px;text-align:right}
.watch .lcd{display:inline-block;font-family:VT;font-size:40px;letter-spacing:3px;color:#ffcf8a;background:rgba(10,8,4,.62);border:1px solid rgba(255,176,82,.25);padding:0 12px;text-shadow:0 0 10px rgba(255,176,82,.45)}
.watch .d{font-family:VT;font-size:18px;color:#7d786d;letter-spacing:2px;margin-top:4px}
.cross{position:absolute;left:794px;top:444px;width:12px;height:12px;border:2px solid rgba(255,236,200,.85);border-radius:50%}
.prompt{position:absolute;left:0;right:0;top:478px;text-align:center}
.prompt .in{display:inline-flex;align-items:center;gap:12px;background:rgba(5,7,13,.6);padding:6px 16px 6px 8px;border-left:2px solid var(--amber)}
.key{font-family:VT;font-size:24px;color:#1b1408;background:var(--amber);padding:0 8px;line-height:28px}
.prompt .l{font-family:VT;font-size:28px;letter-spacing:2px;color:#f4ecdb}
.prompt .s{display:block;font-size:15px;color:#a39e92;margin-top:2px;text-align:center}
.sub{position:absolute;left:0;right:0;bottom:96px;text-align:center}
.sub .in{display:inline-block;max-width:900px;background:rgba(5,7,13,.72);padding:10px 22px 12px}
.sub .who{font-family:VT;font-size:22px;letter-spacing:3px;color:var(--amber);display:block;margin-bottom:2px}
.sub .tx{font-size:22px;line-height:1.45;color:#f1ead8}
.note{position:absolute;left:40px;bottom:96px;display:flex;align-items:center;gap:12px;background:#ebe3cf;color:var(--ink);padding:10px 16px 10px 12px;transform:rotate(-1deg);box-shadow:0 10px 24px rgba(0,0,0,.5)}
.note .st{font-family:VT;font-size:20px;letter-spacing:2px;color:#a0332a;border:2px solid #a0332a;padding:0 6px;transform:rotate(-4deg)}
.note .h{font-family:Hand;font-size:30px;color:#233a7a;line-height:1}
.hint{position:absolute;left:0;right:0;bottom:26px;text-align:center}
.hint .keys{position:static;display:inline-block}
.read{position:absolute;right:40px;top:112px;font-family:VT;font-size:20px;color:#8f8a7e;letter-spacing:1px}
.read b{font-weight:normal;color:var(--paper);border:1px solid #5d584e;padding:0 6px;margin-right:6px}
</style></head><body>
<div class="bg" style="background-image:url(desk-bg.png)"></div>
<div class="obj"><div class="tag">CONTROL ROOM <span>//</span> 23:41</div><div class="t">Read the shift log Dale left on the desk.</div></div>
<div class="watch"><div class="lcd">23:41</div><div class="d">SUN APR 13</div></div>
<div class="read"><b>V</b>READ DESCRIPTION</div>
<div class="cross"></div>
<div class="prompt"><div class="in"><span class="key">E</span><span class="l">READ DALE'S SHIFT LOG</span></div></div>
<div class="sub"><div class="in"><span class="who">23:41</span><span class="tx">Dale left twenty minutes ago.</span></div></div>
<div class="note"><span class="st">NOTED</span><span class="h">Dale's log: lever by the printer</span></div>
<div class="hint"><div class="keys"><span><b>TAB</b>NOTEBOOK</span><span><b>B</b>CASE BOARD</span><span><b>F</b>FLASHLIGHT</span><span><b>ESC</b>PAUSE</span></div></div>
</body></html>
