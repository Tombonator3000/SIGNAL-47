<text x="64" y="1239" font-size="20" font-weight="700" text-anchor="start" style="fill:#152b36" letter-spacing="1">
<tspan x="64" dy="0">KONSEPTKART   •   IKKE MÅLESTOKK   •   IKKE SPILLBILDE</tspan>
</text>
<text x="1736" y="1239" font-size="17" font-weight="400" text-anchor="end" style="fill:#637275">
