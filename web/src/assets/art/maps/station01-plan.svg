</text>
<text x="64" y="123" font-size="52" font-weight="700" text-anchor="start" style="fill:#152b36">
<tspan x="64" dy="0">STATION 01 / DEN GAMLE MÅLESTASJONEN</tspan>
</text>
<text x="66" y="166" font-size="22" font-weight="400" text-anchor="start" style="fill:#637275">
<tspan x="66" dy="0">Forslag til en kompakt three.js-feltsekvens. Unity-feltet finnes fra før.</tspan>
</text>
<line x1="64" y1="191" x2="1736" y2="191" stroke="#152b36" stroke-width="2"/>
