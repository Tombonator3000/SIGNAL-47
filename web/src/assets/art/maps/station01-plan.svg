<g id="proposal-notes">
<text x="1185" y="256" font-size="21" font-weight="700" text-anchor="start" style="fill:#152b36">
<tspan x="1185" dy="0">ETT ROM OG EN KORT FELTSLØYFE</tspan>
</text>
<circle cx="1210" cy="316" r="19" fill="#a8641f" stroke="#a8641f" stroke-width="2"/>
<text x="1210" y="323" font-size="20" font-weight="700" text-anchor="middle" style="fill:#f6f0df">
<tspan x="1210" dy="0">1</tspan>
</text>
<text x="1245" y="324" font-size="24" font-weight="700" text-anchor="start" style="fill:#152b36">
<tspan x="1245" dy="0">En liten feltbygning</tspan>
</text>
<text x="1245" y="361" font-size="21" font-weight="400" text-anchor="start" style="fill:#637275">
<tspan x="1245" dy="0">Benk, historisk logg og protokoll.</tspan>
<tspan x="1245" dy="28.979999999999997">Ingen ny fløy eller byggeklynge.</tspan>
</text>
<circle cx="1210" cy="466" r="19" fill="#a8641f" stroke="#a8641f" stroke-width="2"/>
<text x="1210" y="473" font-size="20" font-weight="700" text-anchor="middle" style="fill:#f6f0df">
<tspan x="1210" dy="0">2</tspan>
</text>
<text x="1245" y="474" font-size="24" font-weight="700" text-anchor="start" style="fill:#152b36">
<tspan x="1245" dy="0">Transit og tre faste merker</tspan>
</text>
<text x="1245" y="511" font-size="21" font-weight="400" text-anchor="start" style="fill:#637275">
<tspan x="1245" dy="0">Kort siktavstand fra samme flate.</tspan>
<tspan x="1245" dy="28.979999999999997">Terrengmerkene får tydelig form.</tspan>
</text>
<circle cx="1210" cy="616" r="19" fill="#a8641f" stroke="#a8641f" stroke-width="2"/>
<text x="1210" y="623" font-size="20" font-weight="700" text-anchor="middle" style="fill:#f6f0df">
<tspan x="1210" dy="0">3</tspan>
</text>
<text x="1245" y="624" font-size="24" font-weight="700" text-anchor="start" style="fill:#152b36">
<tspan x="1245" dy="0">Kabel og retur</tspan>
</text>
<text x="1245" y="661" font-size="21" font-weight="400" text-anchor="start" style="fill:#637275">
<tspan x="1245" dy="0">Følg en synlig, avgrenset kabel.</tspan>
<tspan x="1245" dy="28.979999999999997">Dokumenter bruddet og returner.</tspan>
</text>
<rect x="1185" y="788" width="551" height="307" rx="0" fill="#ebe3cf" stroke="#a8641f" stroke-width="2" stroke-dasharray="10 7"/>
<text x="1210" y="828" font-size="23" font-weight="700" text-anchor="start" style="fill:#a8641f">
<tspan x="1210" dy="0">FØR BLOKKERING</tspan>
</text>
<text x="1210" y="873" font-size="21" font-weight="400" text-anchor="start" style="fill:#637275">
<tspan x="1210" dy="0">Dette er en lokal romlig skisse,</tspan>
<tspan x="1210" dy="28.979999999999997">ikke en oppmåling av Unity-scenen.</tspan>
<tspan x="1210" dy="28.979999999999997"></tspan>
<tspan x="1210" dy="28.979999999999997">Fastmerkene viser ikke oppgavens fasit.</tspan>
<tspan x="1210" dy="28.979999999999997">Historisk foto og bevis må komme fra</tspan>
<tspan x="1210" dy="28.979999999999997">den endelige fysiske oppstillingen.</tspan>
</text>
</g>
