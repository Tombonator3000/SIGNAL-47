<text x="815" y="307" font-size="24" font-weight="700" text-anchor="start" style="fill:#152b36">
<tspan x="815" dy="0">S-03 / ANTENNE</tspan>
</text>
<text x="815" y="343" font-size="18" font-weight="400" text-anchor="start" style="fill:#637275">
<tspan x="815" dy="0">Bakgrunn, ikke gangbar.</tspan>
<tspan x="815" dy="24.839999999999996">Lenger nord enn utsnittet.</tspan>
</text>
<text x="280" y="273" font-size="19" font-weight="400" text-anchor="start" style="fill:#637275">
<tspan x="280" dy="0">27 antenner i scenen.</tspan>
<tspan x="280" dy="26.22">Kun S-03 er vist her.</tspan>
</text>
