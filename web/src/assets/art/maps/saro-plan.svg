<tspan x="898" dy="0">Framkalling</tspan>
<tspan x="898" dy="24.839999999999996">og rapport</tspan>
</text>
<text x="644" y="1071" font-size="17" font-weight="400" text-anchor="end" style="fill:#152b36">
<tspan x="644" dy="0">Østdør</tspan>
</text>
<text x="865" y="1056" font-size="17" font-weight="400" text-anchor="middle" style="fill:#637275">
<tspan x="865" dy="0">Dør på vestsiden</tspan>
</text>
