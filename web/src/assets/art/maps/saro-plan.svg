<title id="title">SARO / FELT, LAB OG ARKIV: redigerbart nærkart</title>
<desc id="desc">Kildeavledet fra main 3264fab. Nord er opp; sørdøra knytter arkivet til kontrollrommet.. Konseptkart, ikke målestokk og ikke spillbilde.</desc>
