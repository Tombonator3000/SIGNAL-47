<text x="150" y="276" font-size="19" font-weight="700" text-anchor="middle" style="fill:#152b36">
<tspan x="150" dy="0">NORD</tspan>
</text>
<text x="150" y="371" font-size="15" font-weight="400" text-anchor="middle" style="fill:#637275">
<tspan x="150" dy="0">-Z i spillet</tspan>
</text>
<circle cx="737.5" cy="320" r="41" fill="#d9d5c8" stroke="#637275" stroke-width="3"/>
<path d="M703.5 305Q737.5 353 771.5 305" fill="none" stroke="#637275" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
