<text x="64" y="54" font-size="20" font-weight="700" text-anchor="start" style="fill:#152b36" letter-spacing="2">
<tspan x="64" dy="0">SIGNAL / 47     •     PRODUKSJONSKART</tspan>
</text>
<text x="64" y="123" font-size="52" font-weight="700" text-anchor="start" style="fill:#152b36">
<tspan x="64" dy="0">SARO / KONTROLLROM OG SERVICEGÅRD</tspan>
</text>
<text x="66" y="166" font-size="22" font-weight="400" text-anchor="start" style="fill:#637275">
<tspan x="66" dy="0">Dagens three.js-oppsett. Nord er opp; østdøra leder til feltet og fotolaben.</tspan>
</text>
<line x1="64" y1="191" x2="1736" y2="191" stroke="#152b36" stroke-width="2"/>
<text x="1736" y="54" font-size="18" font-weight="700" text-anchor="end" style="fill:#a8641f">
<tspan x="1736" dy="0">EKSISTERENDE KJERNE + PLANLAGT ARKIV</tspan>
</text>
<rect x="64" y="220" width="1052" height="910" rx="10" fill="#f6f0df" stroke="#b1b4a9" stroke-width="1"/>
<line x1="1150" y1="220" x2="1150" y2="1130" stroke="#b1b4a9" stroke-width="1"/>
<text x="64" y="1239" font-size="20" font-weight="700" text-anchor="start" style="fill:#152b36" letter-spacing="1">
<tspan x="64" dy="0">KONSEPTKART   •   IKKE MÅLESTOKK   •   IKKE SPILLBILDE</tspan>
</text>
<text x="1736" y="1239" font-size="17" font-weight="400" text-anchor="end" style="fill:#637275">
<tspan x="1736" dy="0">REDIGERBAR SVG  /  SARO</tspan>
</text>
