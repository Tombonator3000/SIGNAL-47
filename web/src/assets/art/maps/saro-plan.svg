<g id="reading-notes">
<text x="1185" y="256" font-size="21" font-weight="700" text-anchor="start" style="fill:#152b36" letter-spacing="1">
<tspan x="1185" dy="0">EN SAMMENHENGENDE RUTE</tspan>
</text>
<circle cx="1210" cy="305" r="19" fill="#152b36" stroke="#152b36" stroke-width="2"/>
<text x="1210" y="312" font-size="20" font-weight="700" text-anchor="middle" style="fill:#f6f0df">
<tspan x="1210" dy="0">1</tspan>
</text>
<text x="1245" y="313" font-size="24" font-weight="700" text-anchor="start" style="fill:#152b36">
<tspan x="1245" dy="0">Kontrollrommet</tspan>
</text>
<text x="1245" y="350" font-size="21" font-weight="400" text-anchor="start" style="fill:#637275">
<tspan x="1245" dy="0">Start ved pulten. Feltkameraet</tspan>
<tspan x="1245" dy="28.979999999999997">hentes ved østdøra.</tspan>
</text>
<circle cx="1210" cy="435" r="19" fill="#152b36" stroke="#152b36" stroke-width="2"/>
<text x="1210" y="442" font-size="20" font-weight="700" text-anchor="middle" style="fill:#f6f0df">
<tspan x="1210" dy="0">2</tspan>
</text>
<text x="1245" y="443" font-size="24" font-weight="700" text-anchor="start" style="fill:#152b36">
<tspan x="1245" dy="0">Servicegård og S-03</tspan>
</text>
<text x="1245" y="480" font-size="21" font-weight="400" text-anchor="start" style="fill:#637275">
<tspan x="1245" dy="0">Gangvei og oppstillingsflate</tspan>
<tspan x="1245" dy="28.979999999999997">leder til skapet, ikke antennen.</tspan>
</text>
<circle cx="1210" cy="565" r="19" fill="#152b36" stroke="#152b36" stroke-width="2"/>
<text x="1210" y="572" font-size="20" font-weight="700" text-anchor="middle" style="fill:#f6f0df">
<tspan x="1210" dy="0">3</tspan>
</text>
<text x="1245" y="573" font-size="24" font-weight="700" text-anchor="start" style="fill:#152b36">
<tspan x="1245" dy="0">B-12 lenger nord</tspan>
</text>
<text x="1245" y="610" font-size="21" font-weight="400" text-anchor="start" style="fill:#637275">
<tspan x="1245" dy="0">Referansen står ved gjerdet.</tspan>
<tspan x="1245" dy="28.979999999999997">Siktlinjen fortsetter mot S-03.</tspan>
</text>
<circle cx="1210" cy="695" r="19" fill="#152b36" stroke="#152b36" stroke-width="2"/>
<text x="1210" y="702" font-size="20" font-weight="700" text-anchor="middle" style="fill:#f6f0df">
<tspan x="1210" dy="0">4</tspan>
</text>
<text x="1245" y="703" font-size="24" font-weight="700" text-anchor="start" style="fill:#152b36">
<tspan x="1245" dy="0">Fotolab øst for gangveien</tspan>
</text>
<text x="1245" y="740" font-size="21" font-weight="400" text-anchor="start" style="fill:#637275">
<tspan x="1245" dy="0">Vestdør gir en kort avstikker.</tspan>
<tspan x="1245" dy="28.979999999999997">Foto og rapport behandles her.</tspan>
</text>
<rect x="1185" y="819" width="551" height="276" rx="0" fill="#ebe3cf" stroke="#a8641f" stroke-width="2" stroke-dasharray="10 7"/>
<text x="1210" y="856" font-size="23" font-weight="700" text-anchor="start" style="fill:#a8641f">
<tspan x="1210" dy="0">ARKIV / SEPARAT PLANINNSETT</tspan>
</text>
<rect x="1210" y="890" width="128" height="112" rx="0" fill="#f0d5a9" stroke="#a8641f" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1274" y="949" font-size="20" font-weight="700" text-anchor="middle" style="fill:#a8641f">
<tspan x="1274" dy="0">ARKIV</tspan>
</text>
<text x="1360" y="916" font-size="20" font-weight="400" text-anchor="start" style="fill:#637275">
<tspan x="1360" dy="0">Ett framtidig rom.</tspan>
<tspan x="1360" dy="27.599999999999998">Plassering og inngang</tspan>
<tspan x="1360" dy="27.599999999999998">er ikke fastlagt.</tspan>
</text>
<text x="1210" y="1057" font-size="19" font-weight="400" text-anchor="start" style="fill:#637275">
<tspan x="1210" dy="0">Ingen ny dør eller fysisk forbindelse er tegnet.</tspan>
</text>
