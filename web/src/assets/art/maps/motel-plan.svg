<g id="proposal-notes">
<text x="1185" y="256" font-size="21" font-weight="700" text-anchor="start" style="fill:#152b36" letter-spacing="1">
<tspan x="1185" dy="0">EN KORT VEI TIL SAMTALEN</tspan>
</text>
<circle cx="1210" cy="316" r="19" fill="#a8641f" stroke="#a8641f" stroke-width="2"/>
<text x="1210" y="323" font-size="20" font-weight="700" text-anchor="middle" style="fill:#f6f0df">
<tspan x="1210" dy="0">1</tspan>
</text>
<text x="1245" y="324" font-size="24" font-weight="700" text-anchor="start" style="fill:#152b36">
<tspan x="1245" dy="0">Parkering og ankomst</tspan>
</text>
<text x="1245" y="361" font-size="21" font-weight="400" text-anchor="start" style="fill:#637275">
<tspan x="1245" dy="0">Synlig motellskilt og oversiktlig</tspan>
<tspan x="1245" dy="28.979999999999997">ganglinje til kontoret.</tspan>
</text>
<circle cx="1210" cy="466" r="19" fill="#a8641f" stroke="#a8641f" stroke-width="2"/>
<text x="1210" y="473" font-size="20" font-weight="700" text-anchor="middle" style="fill:#f6f0df">
<tspan x="1210" dy="0">2</tspan>
</text>
<text x="1245" y="474" font-size="24" font-weight="700" text-anchor="start" style="fill:#152b36">
<tspan x="1245" dy="0">Kontoret etablerer stedet</tspan>
</text>
<text x="1245" y="511" font-size="21" font-weight="400" text-anchor="start" style="fill:#637275">
<tspan x="1245" dy="0">En beskjed leder direkte til Nora.</tspan>
<tspan x="1245" dy="28.979999999999997">Ingen leting gjennom romrekken.</tspan>
</text>
<circle cx="1210" cy="616" r="19" fill="#a8641f" stroke="#a8641f" stroke-width="2"/>
<text x="1210" y="623" font-size="20" font-weight="700" text-anchor="middle" style="fill:#f6f0df">
<tspan x="1210" dy="0">3</tspan>
</text>
<text x="1245" y="624" font-size="24" font-weight="700" text-anchor="start" style="fill:#152b36">
<tspan x="1245" dy="0">Noras rom</tspan>
</text>
<text x="1245" y="661" font-size="21" font-weight="400" text-anchor="start" style="fill:#637275">
<tspan x="1245" dy="0">Plass til Nora, bord og papirbevis.</tspan>
<tspan x="1245" dy="28.979999999999997">Begge interiører inngår i samme tur.</tspan>
</text>
<rect x="1185" y="788" width="551" height="307" rx="0" fill="#ebe3cf" stroke="#a8641f" stroke-width="2" stroke-dasharray="10 7"/>
<text x="1210" y="828" font-size="23" font-weight="700" text-anchor="start" style="fill:#a8641f">
<tspan x="1210" dy="0">AVGRENSNING OG ÅPNE VALG</tspan>
</text>
<text x="1210" y="874" font-size="21" font-weight="400" text-anchor="start" style="fill:#637275">
<tspan x="1210" dy="0">Romnummer er ikke bestemt.</tspan>
<tspan x="1210" dy="28.979999999999997">Derfor brukes bare NORAS ROM.</tspan>
<tspan x="1210" dy="28.979999999999997"></tspan>
<tspan x="1210" dy="28.979999999999997">Basseng, andre rom og veien rundt</tspan>
<tspan x="1210" dy="28.979999999999997">er bakgrunn. Ingen ekstra oppgaver</tspan>
<tspan x="1210" dy="28.979999999999997">eller flere tilgjengelige dører.</tspan>
</text>
</g>
<rect x="80" y="1145" width="32" height="26" rx="0" fill="#f0d5a9" stroke="#a8641f" stroke-width="2" stroke-dasharray="6 4"/>
<text x="132" y="1164" font-size="20" font-weight="400" text-anchor="start" style="fill:#152b36">
<tspan x="132" dy="0">Planlagt tilgjengelig interiør</tspan>
</text>
<line x1="559" y1="1158" x2="599" y2="1158" stroke="#a8641f" stroke-width="7"/>
<text x="611" y="1164" font-size="20" font-weight="400" text-anchor="start" style="fill:#152b36">
<tspan x="611" dy="0">Kort ganglinje</tspan>
</text>
<rect x="944" y="1145" width="32" height="26" rx="0" fill="#d9d5c8" stroke="#b1b4a9" stroke-width="2"/>
<rect x="944" y="1145" width="32" height="26" rx="0" fill="url(#background-hatch)" stroke="none" stroke-width="2"/>
<text x="996" y="1164" font-size="20" font-weight="400" text-anchor="start" style="fill:#152b36">
<tspan x="996" dy="0">Bakgrunn uten romtilgang</tspan>
</text>
</svg>
