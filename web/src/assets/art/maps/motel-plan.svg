<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280" role="img" aria-labelledby="title desc">
<title id="title">SIERRA MOTOR COURT / KONTOR OG NORAS ROM: redigerbart nærkart</title>
<desc id="desc">Forslag til et avgrenset motellområde i three.js. Bare to interiører åpnes.. Konseptkart, ikke målestokk og ikke spillbilde.</desc>
<defs><pattern id="background-hatch" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M-4 4L4-4M0 16L16 0M12 20L20 12" stroke="#b7b9b0" stroke-width="1"/></pattern></defs>
<style>text{font-family:"DejaVu Sans",Arial,sans-serif;}</style>
<rect x="0" y="0" width="1800" height="1280" rx="0" fill="#ebe3cf" stroke="none" stroke-width="2"/>
<text x="64" y="54" font-size="20" font-weight="700" text-anchor="start" style="fill:#152b36" letter-spacing="2">
<tspan x="64" dy="0">SIGNAL / 47     •     PRODUKSJONSKART</tspan>
</text>
<text x="64" y="123" font-size="52" font-weight="700" text-anchor="start" style="fill:#152b36">
<tspan x="64" dy="0">SIERRA MOTOR COURT / KONTOR OG NORAS ROM</tspan>
</text>
<text x="66" y="166" font-size="22" font-weight="400" text-anchor="start" style="fill:#637275">
<tspan x="66" dy="0">Forslag til et avgrenset motellområde i three.js. Bare to interiører åpnes.</tspan>
</text>
<line x1="64" y1="191" x2="1736" y2="191" stroke="#152b36" stroke-width="2"/>
<text x="1736" y="54" font-size="18" font-weight="700" text-anchor="end" style="fill:#a8641f">
<tspan x="1736" dy="0">PLANFORSLAG TIL THREE.JS</tspan>
</text>
