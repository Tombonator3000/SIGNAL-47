[ConsoleVariables]
; VSM's fully conservative non-Nanite instance lists retain many differently sized
; buffers on Vulkan. Reserve a quarter of that worst case, keeping the same shadow
; rendering. The physical diner route verifies GPU visible-instance overflow flags.
r.Shadow.Virtual.NonNanite.CulledInstanceAllocationFactor=0.25

; Vulkan occlusion queries can reject visible vegetation batches after camera turns.
; Keep frustum, GPU instance and distance culling; bypass the unreliable query results.
r.AllowOcclusionQueries=0
