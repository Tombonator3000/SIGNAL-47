[/Script/UnrealEd.EditorLoadingSavingSettings]
; Fonts are loose files; the editor must not offer to import them.
bMonitorContentDirectories=True
-AutoReimportDirectorySettings=(SourceDirectory="/Game/",MountPoint="",Wildcards=((Wildcard="Localization/*")))
+AutoReimportDirectorySettings=(SourceDirectory="/Game/",MountPoint="",Wildcards=((Wildcard="Localization/*"),(Wildcard="Fonts/*")))
