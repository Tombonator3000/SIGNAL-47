[/Script/UnrealEd.EditorLoadingSavingSettings]
; Fonts and the raw recordings (Audio/Raw, Licensed/Raw) are loose files; the editor must not offer to import them.
bMonitorContentDirectories=True
-AutoReimportDirectorySettings=(SourceDirectory="/Game/",MountPoint="",Wildcards=((Wildcard="Localization/*")))
+AutoReimportDirectorySettings=(SourceDirectory="/Game/",MountPoint="",Wildcards=((Wildcard="Localization/*"),(Wildcard="Fonts/*"),(Wildcard="Audio/Raw/*"),(Wildcard="Licensed/Raw/*")))
