[/Script/LinuxTargetPlatform.LinuxTargetSettings]
-TargetedRHIs=SF_VULKAN_SM5
+TargetedRHIs=SF_VULKAN_SM6

[DevOptions.Shaders]
; The cooker writes .shk keys for conversion of recorded PSOs to a stable, shippable cache.
NeedsShaderStableKeys=true
; Keep the material cook within the 31 GiB workstation's budget as well as limiting PSO workers.
; UE applies this physical-memory heuristic before creating ShaderCompileWorker processes.
bForceUseSCWMemoryPressureLimits=True
CookerMemoryUsedInGB=16
MemoryToLeaveForTheOSInGB=8
MemoryUsedPerSCWProcessInGB=2

[ConsoleVariables]
; Hide developer ray tracing overlays during play/menu UI; memory policy is unchanged.
r.RayTracing.ShowOnScreenWarnings=0
; Prefer the supported heap binding path. UE 5.8.4's descriptor-buffer path loses
; this Linux GPU during the finale; the heap path preserves the same scene/shaders.
; Vulkan verifies support and retains descriptor-buffer fallback on other devices.
r.Vulkan.Bindless.PreferredExtension=1
; Use the recorded bundle as the primary startup workload. Generic component/global
; enumeration queued thousands of unused variants on a cold driver. The loading gate
; also renders the actual initial view, covering first-use work outside the bundle.
; Vulkan requires this read-only setting before RHI init to keep the file cache active.
r.Vulkan.AllowPSOPrecaching=1
r.Vulkan.EnablePSOFileCacheWhenPrecachingActive=1
r.PSOPrecaching=1
r.PSOPrecache.Components=0
r.PSOPrecache.GlobalShaders=0
r.PSOPrecache.ProxyCreationStrategy=1
r.PSOPrecaching.MinPriorityForActivePrecacheRequests=0
; Bound the async compiler's memory use; the loading screen waits for all priorities.
r.pso.PrecompileThreadPoolSizeMax=4
r.ShaderPipelineCache.Enabled=1
r.ShaderPipelineCache.StartupMode=1
r.ShaderPipelineCache.MaxPrecompileTime=0
r.ShaderPipelineCache.ExcludePrecachePSO=0
r.ShaderPipelineCache.IncludeAllPrecachedPSOs=0
r.ShaderPipelineCache.PSOPrecacheIncludeMode=0
r.ShaderPipelineCache.SaveUserCache=1
; Record the compute pipelines actually used by the tours. Adding every stable compute
; shader here precompiled 8330 mostly unused variants and made cold loading minutes long.
r.ShaderPipelineCacheTools.IncludeComputePSODuringCook=0

