name: SIGNAL 47 read-only pass06 preflight
on:
  workflow_dispatch:
  push:
    branches: [gauntlet/control-room-06-verified]
    paths: [.github/workflows/pass06-preflight.yml]
permissions:
  contents: read
concurrency:
  group: signal47-linux
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, signal47]
    timeout-minutes: 3
    steps:
      - name: Inspect isolated display dependencies only
        shell: bash
        run: |
          for tool in Xvfb xvfb-run Xorg Xephyr weston xauth apt-get dpkg-deb; do command -v "$tool" || true; done
          dpkg-query -W xvfb xserver-common libxfont2 libgl1-mesa-dri 2>/dev/null || true
          apt-cache policy xvfb xserver-common libxfont2
          printf '\nExisting stamped isolated player:\n'
          file="$GITHUB_WORKSPACE/pass06-isolated/Artifacts/GauntletLinux/build-manifest.json"
          test ! -f "$file" || cat "$file"
          printf '\nSource smoke check count:\n'
          file="$HOME/signal47-tools/evidence/pass06-isolated/34472079119/smoke.log"
          grep -c '^SMOKE_PASS ' "$file" || true
          grep -c '^CONTROL_PASS_SMOKE_PASS ' "$file" || true
