name: SIGNAL 47 read-only pass06 preflight
on:
  workflow_dispatch:
  push:
    branches: [gauntlet/control-room-06-verified]
    paths: [.github/workflows/pass06-preflight.yml]
permissions:
  contents: read
concurrency:
  group: signal47-linux
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, signal47]
    timeout-minutes: 3
    steps:
      - name: Read only the preserved failed game log
        shell: bash
        run: |
          file="$HOME/signal47-tools/evidence/pass06-isolated/34470666592/smoke.log"
          test -f "$file"
          grep -E -A 6 'CONTROL_PASS_SMOKE_|WORLD_PASS_SMOKE_|SMOKE_FAIL|Exception|Error|SIGNAL47_SMOKE_' "$file" || true
          tail -n 24 "$file"
